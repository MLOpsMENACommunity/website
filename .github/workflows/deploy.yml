name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuilds the frozen HTML so time-derived content stays honest: a session
  # that has aired moves itself into "Past" within six hours, and the YouTube,
  # GitHub and Discord figures refresh. Sessions air around 20:00 Cairo, so a
  # daily run would strand a Saturday-night session for most of Sunday.
  #
  # Minute 17 rather than 00 — GitHub's scheduler is heavily oversubscribed on
  # the hour and delays runs accordingly.
  #
  # NOTE: GitHub disables scheduled workflows in public repos after 60 days
  # without repository activity. The refresh commits below count as activity,
  # so this is self-sustaining — but if it ever goes quiet for two months the
  # cron stops silently.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  # `write` so the scheduled run can commit refreshed data back. Pushes made
  # with the default GITHUB_TOKEN do not trigger workflows, so this cannot loop.
  # Do not swap in a PAT — that reintroduces the loop.
  contents: write
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      # Ordinary pushes stay offline and fast; only the cron and manual runs
      # touch the network.
      - name: Refresh external data
        if: github.event_name != 'push'
        run: npm run refresh
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Not a secret you create — Actions mints this for every run. It only
          # lifts the anonymous API's 60-requests-an-hour-per-IP ceiling, which
          # is shared with every other job on the same runner.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Durability and audit trail only — the artifact below is built from the
      # freshly fetched files either way, so losing a race to a human push must
      # never cost a deploy.
      - name: Commit refreshed data
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          git diff --quiet -- data/generated && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh external data" -- data/generated
          git pull --rebase --autostash origin main
          git push

      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo if it is not enabled yet, so no manual
          # Settings -> Pages step is needed for the first deploy.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
